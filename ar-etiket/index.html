<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Etiket Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../style.css?v=11">
<style>
  #types { display: flex; gap: 6px; }
  #ui button.on { background: #39e6ff; color: #03141e; }
  #labelText { font: 500 14px Montserrat, "Segoe UI", sans-serif; padding: 10px 12px; width: min(220px, 60vw); border-radius: 6px;
    border: 1px solid #39e6ff; background: rgba(3, 20, 30, .85); color: #e4fbff; -webkit-user-select: text; user-select: text; }
  #credit { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); font-size: 11px; opacity: .45; z-index: 2; text-align: right; }
  #credit a { color: inherit; }
  @media (max-width: 700px) { #credit { top: calc(86px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: auto; text-align: left; } }
</style>
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }</script>
</head>
<body>
<div id="overlay">
  <div id="hint"></div>
  <nav id="navlink"><a href="../">Kokpit HUD</a> · <a href="../el-menu/">El menüsü</a> · <a href="../tanitim/">Tanıtım</a></nav>
  <div id="credit">Modeller: <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/SheenChair">Sheen Chair</a> (CC0, Khronos) ·
    <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/LightsPunctualLamp">Lamba</a> (CC BY 4.0, DGG)</div>
  <div id="ui">
    <div id="types"></div>
    <input id="labelText" maxlength="40" placeholder="Etiket yazısı">
    <button id="undo">Geri al</button>
    <button id="clear">Temizle</button>
  </div>
  <div id="toast" hidden></div>
</div>
<div id="boot">Yükleniyor…</div>
<script src="../boot.js?v=11"></script>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
