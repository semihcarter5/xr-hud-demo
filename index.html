<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kokpit HUD Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Eski tarayıcılarda (import map desteklemeyen Safari / Mi Browser vb.) eksik özelliği tamamlar; destekleyenlerde devre dışı kalır -->
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

} }</script>
</head>
<body>
<div id="hint"></div>
<div id="ui"></div>
<div id="toast" hidden></div>
<nav id="navlink">Diğer demolar: <a href="ar-etiket/">AR etiket</a> · <a href="el-menu/">El menüsü</a></nav>
<div id="boot">Yükleniyor…</div>
<script src="boot.js?v=9"></script>
<script type="module">
import * as THREE from 'three';
// ?v=: yeni sürüm yayınlanınca telefon eski dosyaları önbellekten karıştırmasın
import { createEditor } from './editor.js?v=9';
import { defaultSettings, mergeSettings, layoutBounds, CONTEXT_NAMES } from './settings.js?v=9';
import { setupInput } from './input.js?v=9';
import { setupVR } from './vr.js?v=9';
import { setupCompat } from './compat.js?v=9';

const settings = defaultSettings();
const T = settings.theme;
const AMBER = '#ffb347';

// --- Renderer, sahne, kamera ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0x03070c);
const FOG = new THREE.Fog(0x03070c, 20, 70);
scene.background = BG;
scene.fog = FOG;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 0);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0x88ccff, 0x0a1a22, 1.2));

// --- Ortam (AR modunda gizlenir) ---
const env = new THREE.Group();
scene.add(env);
{
  const n = 1500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 80 + Math.random() * 40, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.9 + 2;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  env.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fdcff, size: 0.35, fog: false })));
}
env.add(new THREE.GridHelper(120, 60, 0x1b6f80, 0x0c3440));

// --- Hedef dronlar ---
const drones = [];
const droneGeo = new THREE.IcosahedronGeometry(0.45, 0);
function spawn(d) {
  const a = Math.random() * Math.PI * 2, r = 8 + Math.random() * 14;
  d.userData.center = new THREE.Vector3(Math.cos(a) * r, 1.5 + Math.random() * 5, Math.sin(a) * r);
  d.userData.phase = Math.random() * 10;
  d.userData.speed = 0.3 + Math.random() * 0.5;
  d.userData.alive = true;
  d.userData.dieT = 0;
  d.scale.setScalar(1);
}
for (let i = 0; i < 7; i++) {
  const m = new THREE.Mesh(droneGeo, new THREE.MeshStandardMaterial({ emissiveIntensity: 0.6, flatShading: true }));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(droneGeo), new THREE.LineBasicMaterial({ color: 0xffd2b0 })));
  spawn(m);
  scene.add(m);
  drones.push(m);
}

// --- Hedef üzerindeki kilit çerçevesi ---
const reticle = new THREE.Group();
const reticleMat = new THREE.LineBasicMaterial({ depthTest: false, transparent: true });
{
  const s = 0.8, c = 0.3, pts = [];
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    pts.push(x * s, y * s, 0, x * (s - c), y * s, 0);
    pts.push(x * s, y * s, 0, x * s, y * (s - c), 0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(g, reticleMat);
  lines.renderOrder = 10;
  reticle.add(lines);
}
reticle.visible = false;
scene.add(reticle);

// --- Lazer ışını ---
const beamGeo = new THREE.BufferGeometry();
beamGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
const beam = new THREE.Line(beamGeo, new THREE.LineBasicMaterial({ color: 0x7dffb0, transparent: true }));
beam.frustumCulled = false;
beam.visible = false;
scene.add(beam);
let beamT = 0;

// --- HUD: her panel ayrı canvas + düzlem; hudRig başı takip eder ---
const PX_PER_M = 640;
const hudRig = new THREE.Group();
scene.add(hudRig);
const panels = {};
function makePanel(name, wPx, hPx, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = wPx; canvas.height = hPx;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(wPx / PX_PER_M, hPx / PX_PER_M);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, fog: false }));
  mesh.name = name;
  mesh.renderOrder = 20;
  const outline = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ transparent: true, depthTest: false }));
  outline.renderOrder = 21;
  outline.visible = false;
  mesh.add(outline);
  mesh.userData = { ctx: canvas.getContext('2d'), tex, draw, outline };
  hudRig.add(mesh);
  panels[name] = mesh;
}

function prep(c) {
  c.clearRect(0, 0, c.canvas.width, c.canvas.height);
  c.lineWidth = 2;
  c.shadowBlur = T.glow;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.globalAlpha = 1;
  ink(c, T.main);
}
function ink(c, color) { c.strokeStyle = color; c.fillStyle = color; c.shadowColor = color; }

const COMPASS = { 0: 'K', 90: 'D', 180: 'G', 270: 'B' };
makePanel('compass', 512, 128, (c, s) => {
  const cx = 256, cy = 48, span = 90, ppd = 400 / span;
  c.save();
  c.beginPath(); c.rect(cx - 200, cy - 34, 400, 60); c.clip();
  c.font = '600 22px Montserrat, sans-serif';
  for (let d = Math.floor((s.heading - span / 2) / 5) * 5; d <= s.heading + span / 2; d += 5) {
    const x = cx + (d - s.heading) * ppd, dd = ((d % 360) + 360) % 360, major = dd % 30 === 0;
    c.beginPath(); c.moveTo(x, cy + 20); c.lineTo(x, cy + (major ? 2 : 12)); c.stroke();
    if (major) c.fillText(COMPASS[dd] ?? String(dd).padStart(3, '0'), x, cy - 14);
  }
  c.restore();
  c.beginPath(); c.moveTo(cx, cy + 24); c.lineTo(cx - 8, cy + 36); c.lineTo(cx + 8, cy + 36); c.closePath(); c.fill();
  c.font = '600 20px Montserrat, sans-serif';
  c.fillText(String(Math.round(s.heading) % 360).padStart(3, '0') + '°', cx, cy + 56);
});

makePanel('center', 512, 384, (c, s) => {
  const W = 512, H = 384, mx = W / 2, my = H / 2;
  for (const [x, y, sx, sy] of [[10, 10, 1, 1], [W - 10, 10, -1, 1], [10, H - 10, 1, -1], [W - 10, H - 10, -1, -1]]) {
    c.beginPath(); c.moveTo(x + sx * 40, y); c.lineTo(x, y); c.lineTo(x, y + sy * 28); c.stroke();
  }
  // Yunuslama merdiveni
  c.save();
  c.beginPath(); c.rect(mx - 230, my - 150, 460, 300); c.clip();
  c.font = '600 15px Montserrat, sans-serif';
  c.globalAlpha = 0.7;
  for (let p = -60; p <= 60; p += 10) {
    const y = my + (s.pitchDeg - p) * 6;
    if (y < my - 150 || y > my + 150) continue;
    const half = p === 0 ? 190 : 140;
    c.setLineDash(p < 0 ? [8, 6] : []);
    c.beginPath(); c.moveTo(mx - half, y); c.lineTo(mx - 60, y); c.moveTo(mx + 60, y); c.lineTo(mx + half, y); c.stroke();
    if (p !== 0) { c.fillText(String(p), mx - half - 18, y); c.fillText(String(p), mx + half + 18, y); }
  }
  c.setLineDash([]);
  c.restore();
  // Nişangâh
  c.beginPath(); c.arc(mx, my, 18, 0, Math.PI * 2); c.stroke();
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    c.beginPath(); c.moveTo(mx + dx * 26, my + dy * 26); c.lineTo(mx + dx * 40, my + dy * 40); c.stroke();
  }
  // Kilit durumu
  c.font = '600 22px Montserrat, sans-serif';
  if (locked) {
    if (Math.floor(s.t * 4) % 2 === 0) { ink(c, T.lock); c.fillText('HEDEF KİLİTLENDİ', mx, my + 70); }
  } else if (candidate) {
    c.fillText('KİLİTLENİYOR ' + Math.round(lockT * 100) + '%', mx, my + 70);
  } else {
    c.globalAlpha = 0.6; c.fillText('TARANIYOR', mx, my + 70); c.globalAlpha = 1;
  }
  // Anlık mesaj
  if (flashT > 0) {
    c.globalAlpha = Math.min(1, flashT * 2);
    c.font = '700 24px Montserrat, sans-serif';
    ink(c, flash.startsWith('ENERJİ') ? AMBER : T.energy);
    c.fillText(flash, mx, H - 36);
  }
});

makePanel('energy', 128, 384, c => {
  const ex = 44, ey0 = 48, eh = 280, segs = 20, sh = eh / segs;
  const col = energy > 40 ? T.energy : energy > 20 ? AMBER : T.lock;
  c.font = '600 17px Montserrat, sans-serif';
  c.fillText('ENERJİ', 64, 22);
  for (let i = 0; i < segs; i++) {
    const filled = (i + 1) / segs <= energy / 100 + 1e-6;
    c.globalAlpha = filled ? 1 : 0.2;
    c.fillStyle = filled ? col : T.main;
    c.fillRect(ex, ey0 + eh - (i + 1) * sh + 2, 40, sh - 4);
  }
  c.globalAlpha = 1;
  ink(c, col);
  c.fillText(Math.round(energy) + '%', 64, ey0 + eh + 26);
});

makePanel('stats', 320, 256, (c, s) => {
  const rx = 300;
  c.textAlign = 'right';
  c.font = '600 18px Montserrat, sans-serif';
  c.fillText('SKOR', rx, 30);
  c.font = '700 30px Montserrat, sans-serif';
  c.fillText(String(score).padStart(6, '0'), rx, 64);
  c.font = '600 18px Montserrat, sans-serif';
  const rows = [
    ['HEDEF', String(drones.filter(d => d.userData.alive).length)],
    ['İRTİFA', s.altitude.toFixed(1) + ' m'],
    ['YUNUS', (s.pitchDeg >= 0 ? '+' : '') + s.pitchDeg.toFixed(0) + '°'],
    ['SÜRE', Math.floor(s.t) + ' s'],
  ];
  rows.forEach(([label, value], i) => {
    const y = 120 + i * 30;
    c.textAlign = 'left'; c.globalAlpha = 0.7; c.fillText(label, 130, y);
    c.textAlign = 'right'; c.globalAlpha = 1; c.fillText(value, rx, y);
  });
});

// Ayarları sahneye uygular (yükleme, düzenleme, sıfırlama sonrası)
function applySettings() {
  for (const [name, mesh] of Object.entries(panels)) {
    const p = settings.panels[name];
    mesh.position.fromArray(p.position);
    mesh.rotation.set(...p.rotation.map(THREE.MathUtils.degToRad));
    mesh.position.z = Math.min(mesh.position.z, settings.hud.distance - 0.6); // göze 60 cm'den fazla yaklaşmasın
    mesh.scale.setScalar(p.scale);
    mesh.visible = p.visible;
    mesh.material.opacity = T.opacity * (settings.context === 'ar' ? 0.8 : 1); // AR: gerçek dünya görünsün
  }
  for (const d of drones) {
    d.material.color.set(T.drone);
    d.material.emissive.set(T.drone).multiplyScalar(0.7);
  }
}
applySettings();

// --- Oyun durumu ---
let energy = 100, score = 0, lockT = 0, candidate = null, locked = null;
let flash = '', flashT = 0;
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q = new THREE.Quaternion();

function fire(controller) {
  if (energy < 15) { flash = 'ENERJİ YETERSİZ'; flashT = 1; return; }
  energy -= 15;
  const from = controller
    ? controller.getWorldPosition(_v1)
    : camera.getWorldPosition(_v1).add(_v2.set(0.25, -0.3, 0).applyQuaternion(camera.getWorldQuaternion(_q)));
  let to;
  if (locked) {
    to = locked.position.clone();
    locked.userData.alive = false;
    locked.userData.dieT = 0;
    score += 100;
    flash = 'HEDEF İMHA EDİLDİ'; flashT = 1;
    locked = null; candidate = null; lockT = 0;
  } else {
    to = camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(40).add(camera.getWorldPosition(new THREE.Vector3()));
  }
  const p = beamGeo.attributes.position;
  p.setXYZ(0, from.x, from.y, from.z);
  p.setXYZ(1, to.x, to.y, to.z);
  p.needsUpdate = true;
  beamT = 1;
  beam.visible = true;
}

// --- Düzenleme modu (editor.js) ---
const hint = document.getElementById('hint');
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2200);
}
const TOUCH = matchMedia('(pointer: coarse)').matches;
const HEADSET = /OculusBrowser|Quest|Pico|Wolvic/i.test(navigator.userAgent);
const PLAY_HINT = TOUCH
  ? 'Bir parmakla sürükle: bak · Diğer parmakla dokun: ateş et'
  : 'Sürükle: etrafa bak · Tıkla veya Boşluk: ateş et · Kilitlenince ateş et · E: düzenle';
const EDIT_HINT = TOUCH
  ? 'DÜZENLEME · Dokun: panel seç · Oklarla taşı · İki parmak: büyüt/küçült ve yatır'
  : 'DÜZENLEME · Panele tıkla: seç · W taşı · T döndür · R ölçekle · Tekerlek: boyut · E/Esc: çık';
hint.textContent = PLAY_HINT;

const ui = document.getElementById('ui');
const editBtn = document.createElement('button');
editBtn.textContent = 'Düzenle (E)';
ui.appendChild(editBtn);
// Otomatiğe dön: bu ortamın ince ayarlarını siler; yanlışlıkla basılmasın diye ikinci dokunuşta çalışır
const RESET_LABEL = 'Otomatiğe dön';
const resetBtn = document.createElement('button');
resetBtn.textContent = RESET_LABEL;
resetBtn.hidden = true;
ui.appendChild(resetBtn);
let resetArmed = 0;

const editor = createEditor({
  THREE, scene, camera, renderer, panels, settings, applySettings, mergeSettings, defaultSettings, toast,
  contextNames: CONTEXT_NAMES,
  onToggle(on) {
    hint.textContent = on ? EDIT_HINT : PLAY_HINT;
    editBtn.textContent = on ? 'Kaydet ve Kapat' : 'Düzenle (E)';
    resetBtn.hidden = !on;
  },
});
editBtn.onclick = () => editor.setEditMode(!editor.isEditing());
resetBtn.onclick = () => {
  if (resetArmed) {
    clearTimeout(resetArmed); resetArmed = 0;
    resetBtn.textContent = RESET_LABEL;
    editor.resetContext();
    return;
  }
  resetBtn.textContent = 'Emin misin? Tekrar dokun';
  resetArmed = setTimeout(() => { resetArmed = 0; resetBtn.textContent = RESET_LABEL; }, 3000);
};

// --- Fare / dokunmatik / klavye (input.js) ---
let yaw = 0, pitch = 0;
const input = setupInput({
  el: renderer.domElement, editor,
  fire: () => fire(null),
  onLook(dx, dy) {
    yaw -= dx * 0.004;
    pitch = THREE.MathUtils.clamp(pitch - dy * 0.004, -1.2, 1.2);
  },
});
// Hareketle bakma (jiroskop), otomatik kalite, grafik bağlantısı toparlama (compat.js)
const compat = setupCompat({ THREE, renderer, ui, toast, touch: TOUCH });

// --- VR: oturum butonları, kumanda/el ile ateş ve panelleri tutup taşıma (vr.js) ---
const vr = await setupVR({
  THREE, renderer, scene, hudRig, panels, ui, env, BG, FOG, theme: T,
  onEnter: () => editor.setEditMode(false),
  onFire: fire,
  onGrab: () => { flash = 'PANEL TUTULDU'; flashT = 1.5; },
  onRelease: panel => { editor.commit(panel); flash = 'PANEL YERLEŞTİ'; flashT = 1; },
});
if (!navigator.xr && !TOUCH) hint.textContent += ' · WebXR yok, masaüstü modu';

// --- Ana döngü ---
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camDir = new THREE.Vector3(), camQ = new THREE.Quaternion(), tmp = new THREE.Vector3();
let frame = 0, lastAspect = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const xr = renderer.xr.isPresenting;
  if (!xr) {
    input.update(dt);
    compat.tick(dt);
    // Hareketle bakma açıksa yön telefondan gelir; parmakla sağa sola kaydırma üstüne eklenir
    const m = compat.motion;
    if (m.active) camera.rotation.set(m.pitch, m.yaw + yaw, m.roll, 'YXZ');
    else camera.rotation.set(pitch, yaw, 0, 'YXZ');
  }
  camera.updateMatrixWorld();
  camera.getWorldPosition(camPos);
  camera.getWorldDirection(camDir);
  camera.getWorldQuaternion(camQ);

  // Dron hareketi ve bakış yönüne en yakın hedef
  let best = null, bestAng = 0.14;
  for (const d of drones) {
    const u = d.userData;
    if (u.alive) {
      const ph = t * u.speed + u.phase;
      d.position.set(u.center.x + Math.cos(ph) * 2.5, u.center.y + Math.sin(ph * 1.7) * 0.8, u.center.z + Math.sin(ph) * 2.5);
      d.rotation.x += dt; d.rotation.y += dt * 1.3;
      const ang = tmp.subVectors(d.position, camPos).normalize().angleTo(camDir);
      if (ang < bestAng) { bestAng = ang; best = d; }
    } else {
      u.dieT += dt;
      d.scale.setScalar(Math.max(0.001, 1 - u.dieT * 3));
      d.rotation.y += dt * 10;
      if (u.dieT > 1.5) spawn(d);
    }
  }
  if (editor.isEditing()) best = null; // düzenlerken kilitlenme olmasın
  if (best && best === candidate) lockT = Math.min(1, lockT + dt / 0.7);
  else { candidate = best; lockT = 0; }
  locked = candidate && lockT >= 1 ? candidate : null;

  if (candidate) {
    reticle.visible = true;
    reticle.position.copy(candidate.position);
    reticle.quaternion.copy(camQ);
    reticle.rotateZ((1 - lockT) * t * 3);
    reticle.scale.setScalar(1.6 - 0.8 * lockT);
    reticleMat.color.set(locked ? T.lock : T.main);
  } else reticle.visible = false;

  energy = Math.min(100, energy + dt * 8);
  if (flashT > 0) flashT -= dt;
  if (beamT > 0) { beamT -= dt * 4; beam.material.opacity = Math.max(0, beamT); beam.visible = beamT > 0; }

  // Ortamı algıla (masaüstü, telefon yatay/dikey, VR, AR) ve otomatik düzeni ona göre hesapla
  const ctx = xr ? (vr.mode() === 'immersive-ar' ? 'ar' : 'vr')
    : camera.aspect < 1 ? 'portrait' : TOUCH ? 'landscape' : 'desktop';
  const aspectKey = Math.round(innerWidth / innerHeight * 20) / 20;
  if (ctx !== settings.context || aspectKey !== lastAspect) {
    const changed = ctx !== settings.context;
    lastAspect = aspectKey;
    settings.setContext(ctx, aspectKey, !HEADSET);
    applySettings();
    editor.refresh();
    if (changed && editor.isEditing()) toast('Düzen: ' + CONTEXT_NAMES[ctx] + (settings.isTuned() ? ' (ince ayarlı)' : ' (otomatik)'));
  }

  // HUD: masaüstünde sabit ve pencereye sığar, VR'da başı yumuşak takip eder
  const dist = settings.hud.distance;
  const target = tmp.copy(camDir).multiplyScalar(dist).add(camPos);
  const k = xr ? 1 - Math.exp(-dt * 5) : 1;
  hudRig.position.lerp(target, k);
  hudRig.quaternion.slerp(camQ, k);
  if (xr) { hudRig.scale.setScalar(1); vr.update(); }
  else {
    const visH = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), visW = visH * camera.aspect;
    const makeRoom = editor.isPanelOpen() && innerWidth >= 700; // geniş ekranda açık ayar paneline yer aç
    const fit = makeRoom ? 0.62 : 0.94;
    const b = layoutBounds(settings.auto); // sığdırma otomatik düzene göre: ince ayar yaparken HUD zıplamasın
    hudRig.scale.setScalar(Math.min(fit * visW / b.w, fit * 0.85 * visH / b.h));
    if (makeRoom) hudRig.position.addScaledVector(_v1.set(-1, 0, 0).applyQuaternion(camQ), visW * 0.12);
  }

  if (frame++ % 2 === 0) {
    const s = {
      heading: ((Math.atan2(camDir.x, -camDir.z) * 180 / Math.PI) + 360) % 360,
      pitchDeg: Math.asin(THREE.MathUtils.clamp(camDir.y, -1, 1)) * 180 / Math.PI,
      altitude: camPos.y,
      t,
    };
    for (const mesh of Object.values(panels)) {
      if (!mesh.visible) continue;
      const { ctx, tex, draw } = mesh.userData;
      prep(ctx);
      draw(ctx, s);
      tex.needsUpdate = true;
    }
  }
  renderer.render(scene, camera);
});

// --- Otomatik test kancası (AI ajanları ve tarayıcı testleri için) ---
window.__hud = {
