<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Menüsü Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../style.css?v=9">
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="hint"></div>
<nav id="navlink"><a href="../">Kokpit HUD</a> · <a href="../ar-etiket/">AR etiket</a> · <a href="../tanitim/">Tanıtım</a></nav>
<div id="ui"></div>
<div id="toast" hidden></div>
<div id="boot">Yükleniyor…</div>
<script src="../boot.js?v=9"></script>
<script type="module">
import * as THREE from 'three';
import { setupCompat } from '../compat.js?v=9';

// ?emulate: Meta IWER emülatörü (gözlüksüz VR testi)
if (new URLSearchParams(location.search).has('emulate')) {
  const { XRDevice, metaQuest3 } = await import('https://cdn.jsdelivr.net/npm/iwer@2.4.0/build/iwer.module.js');
  window.__xrDevice = new XRDevice(metaQuest3);
  window.__xrDevice.installRuntime({ forceInstall: true });
}

const TOUCH = matchMedia('(pointer: coarse)').matches;
const hint = document.getElementById('hint');
const ui = document.getElementById('ui');
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2000);
}

// --- Sahne: kaide üstünde yapılandırılabilir ürün ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1016);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.02, 100);
camera.position.set(0, 1.6, 0.6);
scene.add(camera);
const ambient = new THREE.HemisphereLight(0xcfe8ff, 0x1a2630, 0.9);
scene.add(ambient);
const spot = new THREE.SpotLight(0xffffff, 40, 6, 0.5, 0.4);
spot.position.set(0.8, 3, 0);
spot.target.position.set(0, 1.1, -1.2);
scene.add(spot, spot.target);
scene.add(new THREE.GridHelper(10, 20, 0x2f5566, 0x1b3440));
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.8, 48), new THREE.MeshStandardMaterial({ color: 0x1d2a35, roughness: 0.6 }));
pedestal.position.set(0, 0.4, -1.2);
scene.add(pedestal);
const productMat = new THREE.MeshStandardMaterial({ color: 0x39e6ff, metalness: 0.5, roughness: 0.25 });
const product = new THREE.Mesh(new THREE.TorusKnotGeometry(0.16, 0.05, 160, 24), productMat);
product.position.set(0, 1.15, -1.2);
scene.add(product);

// --- Menünün değiştirdiği durum ---
const COLORS = [['Mavi', '#39e6ff'], ['Turuncu', '#ff7a3d'], ['Yeşil', '#7dffb0'], ['Mor', '#b98cff']];
const SIZES = [['Normal', 1], ['Büyük', 1.4], ['Küçük', 0.7]];
const state = { color: 0, size: 0, spin: true, light: true };
const BUTTONS = [
  { id: 'color', label: 'Renk', value: () => COLORS[state.color][0], press() { state.color = (state.color + 1) % COLORS.length; productMat.color.set(COLORS[state.color][1]); } },
  { id: 'spin', label: 'Döndür', value: () => (state.spin ? 'Açık' : 'Kapalı'), press() { state.spin = !state.spin; } },
  { id: 'size', label: 'Boyut', value: () => SIZES[state.size][0], press() { state.size = (state.size + 1) % SIZES.length; } },
  { id: 'light', label: 'Işık', value: () => (state.light ? 'Sahne' : 'Düz'), press() { state.light = !state.light; spot.visible = state.light; ambient.intensity = state.light ? 0.9 : 2.2; } },
];

// --- Menü: 2x2 düğme, gerçek boyut ~16 x 10 cm (bileğin üstünde rahat okunur) ---
const menu = new THREE.Group();
scene.add(menu);
const BW = 0.075, BH = 0.042, GAP = 0.008;
const backing = new THREE.Mesh(new THREE.PlaneGeometry(2 * BW + 3 * GAP, 2 * BH + 3 * GAP + 0.02), new THREE.MeshBasicMaterial({ color: 0x06121a, transparent: true, opacity: 0.85 }));
backing.position.set(0, 0.01, -0.004);
menu.add(backing);
const buttons = BUTTONS.map((b, i) => {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 144;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(BW, BH), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  mesh.position.set((i % 2 ? 1 : -1) * (BW + GAP) / 2, (i < 2 ? 1 : -1) * (BH + GAP) / 2, 0);
  mesh.userData = { ...b, canvas, tex, hover: false, pressT: 0 };
  menu.add(mesh);
  return mesh;
});
function drawButton(m) {
  const { canvas, tex, label, value, hover, pressT } = m.userData, g = canvas.getContext('2d');
  g.clearRect(0, 0, 256, 144);
  g.fillStyle = pressT > 0 ? '#39e6ff' : hover ? 'rgba(57,230,255,0.28)' : 'rgba(20,40,52,0.95)';
  g.fillRect(0, 0, 256, 144);
  g.strokeStyle = '#39e6ff'; g.lineWidth = hover ? 8 : 4; g.strokeRect(2, 2, 252, 140);
  g.textAlign = 'center';
  g.fillStyle = pressT > 0 ? '#03141e' : '#e8fbff';
  g.font = '700 40px Montserrat, sans-serif'; g.fillText(label, 128, 62);
  g.font = '600 30px Montserrat, sans-serif'; g.fillStyle = pressT > 0 ? '#03141e' : '#9fe9f7'; g.fillText(value(), 128, 110);
  tex.needsUpdate = true;
}
const title = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.02), new THREE.MeshBasicMaterial({ transparent: true, map: (() => {
  const c = document.createElement('canvas'); c.width = 384; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#7dffb0'; g.font = '700 34px Montserrat, sans-serif'; g.textAlign = 'center'; g.fillText('ÜRÜN AYARLARI', 192, 44);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})() }));
title.position.y = BH + GAP + 0.012;
menu.add(title);

// Basış: görsel çökme + kısa ses + menü durum yazısı güncellenir
let audio = null;
function click() {
  try {
    audio ||= new AudioContext();
    const o = audio.createOscillator(), v = audio.createGain();
    o.frequency.value = 880; v.gain.setValueAtTime(0.08, audio.currentTime); v.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.08);
    o.connect(v).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.09);
  } catch { /* ses yoksa sessiz devam */ }
}
function pressButton(m) {
  if (m.userData.pressT > 0) return; // çift tetiklemeyi önle
  m.userData.press();
  m.userData.pressT = 0.25;
  click();
  toast(`${m.userData.label}: ${m.userData.value()}`);
}

// --- Telefon / bilgisayar: menü ekranın altında yüzer; dokun / tıkla ---
const compat = setupCompat({ THREE, renderer, ui, toast, touch: TOUCH });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let yaw = 0, pitch = -0.25, drag = null;
const canvas = renderer.domElement;
function screenHit(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(buttons, false)[0]?.object || null;
}
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
canvas.addEventListener('pointermove', e => {
  if (!renderer.xr.isPresenting && e.pointerType === 'mouse') { const h = screenHit(e); for (const b of buttons) b.userData.hover = b === h; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
  yaw -= dx * 0.004; pitch = THREE.MathUtils.clamp(pitch - dy * 0.004, -1.2, 1.0);
});
canvas.addEventListener('pointerup', e => {
  if (drag && drag.moved < 8 && !renderer.xr.isPresenting) { const h = screenHit(e); if (h) pressButton(h); }
  drag = null;
});

// --- VR: menü sol ele / sol kumandaya bağlı; sağ ışın + tetik/pinch ya da parmakla dokunarak basılır ---
const hands = [0, 1].map(i => renderer.xr.getHand(i));
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i);
  c.userData.handedness = null;
  c.addEventListener('connected', e => { c.userData.handedness = e.data.handedness; c.userData.isHand = !!e.data.hand; grip.userData.handedness = e.data.handedness; });
  c.addEventListener('disconnected', () => { c.userData.handedness = null; });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0x39e6ff, transparent: true, opacity: 0.7 }));
  line.visible = false; c.add(line); c.userData.line = line;
  c.addEventListener('selectstart', () => { const h = c.userData.hover; if (h) pressButton(h); });
  scene.add(c, grip, hands[i]);
  return { c, grip, hand: hands[i] };
});
const rot = new THREE.Matrix4(), tmp = new THREE.Vector3(), camPos = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
function rayHit(c) {
  rot.identity().extractRotation(c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(c.matrixWorld);
  ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
  return ray.intersectObjects(buttons, false)[0] || null;
}
function updateXR() {
  const left = ctrls.find(x => x.c.userData.handedness === 'left'), right = ctrls.find(x => x.c.userData.handedness === 'right');
  // Menü: sol el bileğinin (veya sol kumandanın) 9 cm üstünde, yüzü kullanıcıya dönük
  const wrist = left?.hand.joints?.wrist;
  const anchor = wrist && left.c.userData.isHand ? wrist : left?.grip;
  if (anchor) {
    anchor.getWorldPosition(menu.position).add(tmp.set(0, 0.09, 0));
    menu.lookAt(camPos);
    menu.visible = true;
  } else menu.visible = false;
  for (const x of ctrls) { x.c.userData.hover = null; x.c.userData.line.visible = false; }
  if (right) {
    // Parmakla dokunma: sağ işaret parmağı ucu düğmeye 2,5 cm yaklaşınca basılır
    const tip = right.hand.joints?.['index-finger-tip'];
    if (tip && right.c.userData.isHand) {
      tip.getWorldPosition(tmp);
      for (const b of buttons) {
        const d = b.getWorldPosition(new THREE.Vector3()).distanceTo(tmp);
        if (d < 0.025 && !b.userData.poked) { b.userData.poked = true; pressButton(b); } // parmak girince bir kez
        else if (d > 0.04) b.userData.poked = false; // parmak uzaklaşınca tekrar basılabilir
      }
    }
    const h = rayHit(right.c);
    right.c.userData.hover = h?.object || null;
    right.c.userData.line.visible = true;
    right.c.userData.line.scale.z = h ? h.distance : 1;
  }
  for (const b of buttons) b.userData.hover = ctrls.some(x => x.c.userData.hover === b);
}

async function addVRButton() {
  if (!navigator.xr) return;
  const timeout = new Promise(r => setTimeout(() => r(false), 3000));
  if (!await Promise.race([navigator.xr.isSessionSupported('immersive-vr').catch(() => false), timeout])) return;
  const b = document.createElement('button');
  b.textContent = 'VR’a Gir';
  ui.prepend(b);
  b.onclick = async () => {
    if (renderer.xr.isPresenting) { renderer.xr.getSession().end(); return; }
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
    session.addEventListener('end', () => { b.textContent = 'VR’a Gir'; menu.visible = true; });
    await renderer.xr.setSession(session);
    b.textContent = 'Çıkış';
  };
}
hint.textContent = TOUCH ? 'Menüdeki düğmelere dokun · Sürükle: bak' : 'Menüdeki düğmelere tıkla · Sürükle: etrafa bak';
await addVRButton();

// --- Ana döngü ---
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), down = new THREE.Vector3();
let frame = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const xr = renderer.xr.isPresenting;
  if (!xr) {
    compat.tick(dt);
    const mo = compat.motion;
    if (mo.active) camera.rotation.set(mo.pitch, mo.yaw + yaw, mo.roll, 'YXZ');
    else camera.rotation.set(pitch, yaw, 0, 'YXZ');
    camera.updateMatrixWorld();
    // Menü 55 cm önde, ürünü kapatmasın: yatay ekranda sağ altta, dikey ekranda alt ortada
    const portrait = camera.aspect < 1;
    camera.getWorldPosition(camPos);
    camera.getWorldDirection(fwd);
    down.set(0, -1, 0).applyQuaternion(camera.quaternion);
    menu.position.copy(camPos).addScaledVector(fwd, 0.55).addScaledVector(down, portrait ? 0.2 : 0.1);
    if (!portrait) menu.position.addScaledVector(tmp.set(1, 0, 0).applyQuaternion(camera.quaternion), Math.min(0.24, 0.13 * camera.aspect));
    menu.quaternion.copy(camera.quaternion);
    menu.scale.setScalar(portrait ? 1.15 : 1.4);
  } else {
    renderer.xr.getCamera().getWorldPosition(camPos);
    menu.scale.setScalar(1);
    updateXR();
  }
  if (state.spin) product.rotation.y += dt * 0.8;
  product.scale.lerp(tmp.setScalar(SIZES[state.size][1]), 1 - Math.exp(-dt * 8));
  for (const b of buttons) {
    const u = b.userData;
    if (u.pressT > 0) u.pressT -= dt;
    b.position.z = u.pressT > 0 ? -0.004 : 0; // basınca içeri çöker
  }
  if (frame++ % 3 === 0) buttons.forEach(drawButton);
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- Otomatik test kancası ---
window.__hud = { camera, buttons, menu, product, state, compat, press: id => pressButton(buttons.find(b => b.userData.id === id)), aim(y, p) { yaw = y; pitch = p; } };
document.getElementById('boot').hidden = true;
</script>
</body>
</html>
